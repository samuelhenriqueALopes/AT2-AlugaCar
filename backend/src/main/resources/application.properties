spring.application.name=alugacar
server.port=${PORT:8080}

# Le as variaveis do arquivo backend/.env (nao versionado), se existir.
spring.config.import=optional:file:.env[.properties]

# ===================== Banco de dados: Supabase (PostgreSQL) =====================
# Configure as variaveis de ambiente (ver backend/.env.example):
#   DB_URL      -> jdbc:postgresql://<host-supabase>:5432/postgres?sslmode=require
#   DB_USERNAME -> usuario do banco (ex.: postgres.<project-ref> no Session Pooler)
#   DB_PASSWORD -> senha do banco
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# O Session Pooler do plano gratuito do Supabase aceita poucas conexoes simultaneas.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=120000

# Tabelas no schema dedicado "alugacar": o Supabase expoe automaticamente o schema "public"
# pela API REST (Data API); um schema proprio fica acessivel somente pelo back-end.
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:alugacar}
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ===================== Seguranca (JWT) =====================
# Em producao, defina JWT_SECRET com pelo menos 32 caracteres.
app.jwt.secret=${JWT_SECRET:alugacar-chave-secreta-de-desenvolvimento-troque-em-producao}
app.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:480}

# Origens liberadas para o front-end (React + Vite)
app.cors.origens=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# Popula usuarios/automoveis de demonstracao se o banco estiver vazio
app.seed=${APP_SEED:true}
