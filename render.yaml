# Blueprint do Render para o back-end Spring Boot (Docker).
# As variaveis marcadas com sync: false sao preenchidas no painel do Render.
services:
  - type: web
    name: alugacar-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: APP_SEED
        value: "true"
